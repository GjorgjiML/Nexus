spring:
  application:
    name: nexus
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false

server:
  port: 8080
  error:
    whitelabel:
      enabled: false

nexus:
  jwt:
    secret: ${JWT_SECRET:NexusDevSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm!!}
    expiration-ms: 86400000
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  cookie:
    name: nexus_token
    secure: false
    same-site: Lax

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexus}
    username: ${SPRING_DATASOURCE_USERNAME:nexus}
    password: ${SPRING_DATASOURCE_PASSWORD:nexus}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false

logging:
  level:
    com.nexus: DEBUG
    org.springframework.security: INFO

