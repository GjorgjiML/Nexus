<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${profile.username})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card profile-card shadow-sm mb-4">
                <div class="card-body p-4">
                    <div class="d-flex flex-column flex-sm-row align-items-sm-center gap-3">
                        <div th:replace="~{fragments/layout :: avatar(${profile.avatarPath}, ${profile.username}, 'avatar-lg')}"></div>
                        <div class="flex-grow-1">
                            <div class="d-flex flex-wrap align-items-center gap-2 justify-content-between">
                                <h1 class="h3 mb-0" th:text="${profile.username}">username</h1>
                                <div class="d-flex gap-2">
                                    <a th:if="${profile.ownProfile}" class="btn btn-outline-primary btn-sm" th:href="@{/profile/edit}">
                                        Edit profile
                                    </a>
                                    <form th:if="${isAuthenticated and !profile.ownProfile and !profile.followedByCurrentUser}"
                                          th:action="@{/profile/{u}/follow(u=${profile.username})}" method="post">
                                        <button type="submit" class="btn btn-primary btn-sm">Follow</button>
                                    </form>
                                    <form th:if="${isAuthenticated and !profile.ownProfile and profile.followedByCurrentUser}"
                                          th:action="@{/profile/{u}/unfollow(u=${profile.username})}" method="post">
                                        <button type="submit" class="btn btn-outline-secondary btn-sm">Unfollow</button>
                                    </form>
                                </div>
                            </div>
                            <p class="text-secondary mt-2 mb-3"
                               th:text="${profile.bio != null and !#strings.isEmpty(profile.bio) ? profile.bio : 'No bio yet.'}">
                                bio
                            </p>
                            <div class="profile-stats d-flex gap-4">
                                <a th:href="@{/profile/{u}/followers(u=${profile.username})}">
                                    <strong th:text="${profile.followerCount}">0</strong> followers
                                </a>
                                <a th:href="@{/profile/{u}/following(u=${profile.username})}">
                                    <strong th:text="${profile.followingCount}">0</strong> following
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <h2 class="h5 mb-3">Posts</h2>

            <div th:if="${#lists.isEmpty(posts)}" class="empty-state mb-3">
                No posts yet.
            </div>

            <div th:each="post : ${posts}">
                <div th:replace="~{fragments/post :: card(${post})}"></div>
            </div>

            <nav th:if="${page.totalPages > 1}" class="mt-3">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/profile/{u}(u=${profile.username}, page=${page.number - 1})}">Previous</a>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link"
                              th:text="'Page ' + (${page.number + 1}) + ' of ' + ${page.totalPages}">Page</span>
                    </li>
                    <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/profile/{u}(u=${profile.username}, page=${page.number + 1})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
