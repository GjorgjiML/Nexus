<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Nexus'">Nexus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/nexus.css}">
    <script>
        (function () {
            const stored = localStorage.getItem('nexus-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-bs-theme', stored || (prefersDark ? 'dark' : 'light'));
        })();
    </script>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg border-bottom sticky-top bg-body">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
            <span class="brand-mark">N</span> Nexus
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0" th:if="${isAuthenticated}">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-house-door"></i> Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/post/create}"><i class="bi bi-plus-circle"></i> Post</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2 ms-auto">
                <button type="button" class="btn btn-outline-secondary btn-sm" id="themeToggle" title="Toggle theme">
                    <i class="bi bi-moon-stars"></i>
                </button>
                <th:block th:if="${isAuthenticated}">
                    <a class="btn btn-outline-primary btn-sm"
                       th:href="@{/profile/{u}(u=${currentUsername})}">
                        <i class="bi bi-person-circle"></i>
                        <span th:text="${currentUsername}">user</span>
                    </a>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
                    </form>
                </th:block>
                <th:block th:unless="${isAuthenticated}">
                    <a class="btn btn-outline-primary btn-sm" th:href="@{/login}">Login</a>
                    <a class="btn btn-primary btn-sm" th:href="@{/register}">Join</a>
                </th:block>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="alerts" class="container mt-3" th:if="${success != null or error != null}">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}">Success</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<footer th:fragment="footer" class="border-top mt-5 py-4">
    <div class="container text-center text-secondary small">
        Nexus &copy; 2026 — a small social media platform
    </div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/nexus.js}"></script>
</th:block>

<div th:fragment="avatar(path, username, sizeClass)" class="avatar-wrap" th:classappend="${sizeClass}">
    <img th:if="${path != null and !path.isEmpty()}"
         th:src="${path}"
         th:alt="${username}"
         class="avatar-img">
    <div th:unless="${path != null and !path.isEmpty()}"
         class="avatar-fallback"
         th:text="${username != null and !#strings.isEmpty(username) ? #strings.substring(username,0,1).toUpperCase() : '?'}">
        A
    </div>
</div>
</body>
</html>
