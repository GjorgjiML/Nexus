<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Home')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card panel-card shadow-sm mb-4 composer">
                <div class="card-body">
                    <h2 class="h5 mb-3">What's happening?</h2>
                    <form th:action="@{/post/create}" th:object="${postForm}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <textarea class="form-control" th:field="*{content}" maxlength="2000"
                                      placeholder="Share something with your network..." required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="image">Image (optional)</label>
                            <input id="image" type="file" class="form-control" name="image" accept="image/*" data-preview>
                            <img id="imagePreview" class="img-fluid rounded mt-2 d-none" alt="Preview">
                        </div>
                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-send"></i> Post
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(posts)}" class="empty-state mb-3">
                <h2 class="h5">Your feed is quiet</h2>
                <p class="mb-0">Follow people or create your first post to get started.</p>
            </div>

            <div th:each="post : ${posts}">
                <div th:replace="~{fragments/post :: card(${post})}"></div>
            </div>

            <nav th:if="${page.totalPages > 1}" class="mt-3">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/(page=${page.number - 1})}">Previous</a>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link"
                              th:text="'Page ' + (${page.number + 1}) + ' of ' + ${page.totalPages}">Page</span>
                    </li>
                    <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/(page=${page.number + 1})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
