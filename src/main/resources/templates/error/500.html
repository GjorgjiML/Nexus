<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card panel-card shadow-sm text-center p-4">
                <div class="display-5 fw-bold text-secondary" th:text="${status != null ? status : 500}">500</div>
                <h1 class="h3 mt-2">Something went wrong</h1>
                <p class="text-secondary" th:text="${message != null ? message : 'Please try again later.'}">
                    Error
                </p>
                <a th:href="@{/}" class="btn btn-primary">Go home</a>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
